name: agente_cfe
description: Aplicación móvil Jamnex.
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  http: ^1.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../frontend/images/Logo1.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../frontend/images/Logo1.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
